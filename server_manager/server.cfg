# Zentrale Konfiguration des AO-Server Tools (wird von lib/common.sh eingelesen).
# Enthält das RCON-Passwort: Rechte auf 600 halten.

TMUX_SESSION="dayz_ao"
PROCESS_NAME="DayZServer"
SERVER_CONFIG="serverDZ.cfg"

GAME_PORT=2302
QUERY_PORT=27016
RCON_PORT=2306

RCON_PASSWORD="CHANGE_ME"
RCON_BIN="bercon-cli"
RCON_TIMEOUT=10
RCON_LOCK_CMD="#lock"
RCON_SHUTDOWN_CMD="#shutdown"

# Steam-Account für Workshop-Downloads (Erstanmeldung interaktiv: steamcmd.sh +login <user>).
STEAM_USER="CHANGE_ME"
WORKSHOP_APPID=221100
SERVER_APPID=223350

# Anzahl behaltener Backups (0 = unbegrenzt) und maximale Logdatei-Größe vor Rotation.
BACKUP_KEEP=14
LOG_MAX_BYTES=5242880

# Optional: Discord-Webhook für Benachrichtigungen (https://...).
DISCORD_WEBHOOK_URL=""

STORAGE_DIR="$SERVER_DIR/mpmissions/dayzOffline.chernarusplus/storage_1"

HIVE_PATTERN="Hive loaded"
CORRUPT_PATTERN="Corrupted Data"

START_TIMEOUT=600
START_RETRIES=3
SHUTDOWN_WARN_MINUTES=5
SHUTDOWN_TIMEOUT=300

RCON_FAIL_LIMIT=3
MAX_ROLLBACKS=2
